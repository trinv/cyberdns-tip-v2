# CyberDNS TIP — stack lab, tự chứa hoàn toàn.
#
# Khác bản production ở ba điểm, đều vì lab không có tên miền công khai:
#
#   1. nginx chạy TRONG container, không phải trên host. Ở production nginx nằm ngoài
#      để chứng thư Let's Encrypt tách khỏi vòng đời container; trong lab không có
#      chứng thư thật nên lý do đó biến mất, và gói mọi thứ vào compose thì dựng và
#      xóa sạch chỉ bằng một lệnh.
#   2. Chứng thư TỰ KÝ, sinh tự động lúc khởi động. Trình duyệt sẽ cảnh báo — đúng như
#      mong đợi, vì không có CA nào ký.
#   3. Mỗi giao diện một cổng riêng thay vì phân biệt theo tên miền: lab không có DNS.
#
# Dùng qua deploy/lab.sh, đừng gọi trực tiếp:
#
#   ./deploy/lab.sh up

name: cyberdns-tip-lab

x-app: &app
  image: cyberdns-tip:lab
  build:
    context: ../..
    dockerfile: Dockerfile
    args:
      VERSION: lab
  environment: &app-env
    TIP_ENV: lab
    TIP_LOG_LEVEL: ${TIP_LOG_LEVEL:-info}
    TIP_DATABASE_DSN: postgres://tip:${POSTGRES_PASSWORD:-labpassword}@postgres:5432/tip?sslmode=disable
    TIP_SNAPSHOT_ROOT: /var/lib/cyberdns-tip/snapshots
    # Chu kỳ ngắn để thấy kết quả nhanh khi thử nghiệm. Production dùng hàng giờ.
    TIP_INGEST_INTERVAL: ${TIP_INGEST_INTERVAL:-30m}
    TIP_POLICY_INTERVAL: ${TIP_POLICY_INTERVAL:-10m}
    TIP_BUILD_INTERVAL: ${TIP_BUILD_INTERVAL:-5m}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpassword}
      POSTGRES_DB: tip
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Mở ra loopback của host để soi CSDL bằng psql khi cần. An toàn trong lab,
      # KHÔNG làm thế ở production.
      - "127.0.0.1:${LAB_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip -d tip"]
      interval: 5s
      timeout: 5s
      retries: 20

  feed-ingestor:
    <<: *app
    command: ["/usr/local/bin/feed-ingestor", "-config", "/etc/cyberdns-tip/configs/feed-ingestor.yaml"]
    environment:
      <<: *app-env
      TIP_OPS_ADDR: "0.0.0.0:9101"
    volumes:
      - snapshot-data:/var/lib/cyberdns-tip/snapshots
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9101/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  policy-engine:
    <<: *app
    command: ["/usr/local/bin/policy-engine", "-config", "/etc/cyberdns-tip/configs/policy-engine.yaml"]
    environment:
      <<: *app-env
      TIP_OPS_ADDR: "0.0.0.0:9102"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9102/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  blocklist-generator:
    <<: *app
    command: ["/usr/local/bin/blocklist-generator", "-config", "/etc/cyberdns-tip/configs/blocklist-generator.yaml"]
    environment:
      <<: *app-env
      TIP_OPS_ADDR: "0.0.0.0:9103"
      TIP_PUBLIC_ADDR: "0.0.0.0:8080"
      TIP_PUBLIC_BASE_URL: "https://localhost"
    volumes:
      - snapshot-data:/var/lib/cyberdns-tip/snapshots
    healthcheck:
      # Dùng /healthz chứ không phải /readyz: readyz báo chưa sẵn sàng cho tới khi có
      # snapshot đầu tiên, mà snapshot chỉ có sau lần thu thập đầu — nếu dùng readyz
      # thì container bị coi là hỏng suốt mười phút đầu.
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9103/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-api:
    <<: *app
    command: ["/usr/local/bin/admin-api", "-config", "/etc/cyberdns-tip/configs/admin-api.yaml"]
    environment:
      <<: *app-env
      TIP_OPS_ADDR: "0.0.0.0:9104"
      TIP_ADMIN_ADDR: "0.0.0.0:8090"
    volumes:
      - snapshot-data:/var/lib/cyberdns-tip/snapshots
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9104/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Nghe OpenCTI Live Stream và ghi kết quả xuống L1.
  #
  # Khởi động được cả khi CHƯA bật OpenCTI: thiếu url hoặc token thì service đứng yên
  # và vẫn trả /healthz. OpenCTI là thành phần tùy chọn, nên thoát vì thiếu cấu hình sẽ
  # khiến container quay vòng khởi động lại mãi và làm nhiễu mọi dashboard, trong khi
  # phần còn lại của hệ vẫn chạy hoàn toàn bình thường.
  sync-consumer:
    <<: *app
    command: ["/usr/local/bin/sync-consumer", "-config", "/etc/cyberdns-tip/configs/sync-consumer.yaml"]
    environment:
      <<: *app-env
      TIP_OPS_ADDR: "0.0.0.0:9105"
      # Rỗng khi chưa bật OpenCTI. Lớp phủ docker-compose.opencti.yml điền các giá trị
      # thật khi cụm OpenCTI được khởi động.
      TIP_OPENCTI_URL: ${TIP_OPENCTI_URL:-}
      TIP_OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN:-}
      TIP_OPENCTI_STREAM_ID: ${TIP_OPENCTI_STREAM_ID:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9105/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # Sinh chứng thư tự ký một lần rồi giữ lại trong volume.
  #
  # Chạy như một service có healthcheck thay vì init container, vì compose không có
  # khái niệm init container: nginx chờ service này "healthy" rồi mới khởi động.
  certgen:
    image: alpine/openssl:latest
    volumes:
      - certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /certs/lab.crt ]; then
          openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
            -keyout /certs/lab.key -out /certs/lab.crt \
            -subj "/CN=cyberdns-tip-lab" \
            -addext "subjectAltName=DNS:localhost,DNS:tip.cyberdns.vn,IP:127.0.0.1"
          chmod 644 /certs/lab.key /certs/lab.crt
        fi
        tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/certs/lab.crt"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginx:1-alpine
    ports:
      - "${LAB_BLOCKLIST_PORT:-8443}:443"   # blocklist công khai
      - "${LAB_ADMIN_PORT:-9443}:9443"      # dashboard quản trị
      - "${LAB_OPENCTI_PORT:-10443}:10443"  # OpenCTI (502 khi chưa bật)
    volumes:
      - ./lab-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certgen:
        condition: service_healthy
      blocklist-generator:
        condition: service_started
      admin-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  snapshot-data:
  certs:
