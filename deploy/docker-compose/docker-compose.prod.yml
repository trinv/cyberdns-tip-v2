# Triển khai production cho https://tip.cyberdns.vn
#
#   cp .env.example .env   # rồi điền bí mật vào
#   docker compose -f docker-compose.prod.yml up -d
#
# Không có bước migrate thủ công: service "bootstrap" chạy migration và tạo tài khoản
# quản trị đầu tiên, và mọi service khác chờ nó chạy xong mới khởi động.
#
# TLS và reverse proxy do nginx TRÊN HOST đảm nhiệm (systemd), không phải container:
# chứng thư số ở /etc/letsencrypt tách hẳn khỏi vòng đời container, nên build lại stack
# không đụng tới cert. Xem deploy/nginx/tip.cyberdns.vn.conf.
#
# Nguyên tắc phơi cổng: KHÔNG container nào mở ra Internet. blocklist-generator chỉ
# publish lên 127.0.0.1 của host để nginx proxy tới. PostgreSQL, các cổng vận hành,
# Prometheus và Grafana không publish cổng nào — /metrics phơi cấu trúc nội bộ cùng số
# liệu vận hành nên không bao giờ được ra ngoài.

name: cyberdns-tip

x-service-base: &service-base
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &service-env
    TIP_ENV: production
    TIP_LOG_LEVEL: ${TIP_LOG_LEVEL:-info}
    TIP_DATABASE_DSN: postgres://tip:${POSTGRES_PASSWORD:?cần đặt POSTGRES_PASSWORD}@postgres:5432/tip?sslmode=disable
    TIP_SNAPSHOT_ROOT: /var/lib/cyberdns-tip/snapshots
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  restart: unless-stopped
  # Container chỉ cần ghi vào volume snapshot; phần còn lại để chỉ đọc.
  read_only: true
  # Rootfs chỉ đọc nên vẫn cần một chỗ ghi tạm cho thư viện chuẩn.
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cần đặt POSTGRES_PASSWORD}
      POSTGRES_DB: tip
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip -d tip"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Không publish cổng: chỉ các service trong mạng compose truy cập được.

  # Đưa CSDL về trạng thái chạy được rồi thoát: migration, tài khoản quản trị đầu
  # tiên, bật nguồn OpenCTI nếu đã cấu hình. Cả ba đều idempotent.
  #
  # TIP_ADMIN_PASSWORD trong .env quyết định mật khẩu tài khoản đầu tiên. Bỏ trống thì
  # bootstrap sinh ngẫu nhiên và in ra nhật ký của chính nó:
  #   docker compose -f docker-compose.prod.yml logs bootstrap
  bootstrap:
    <<: *service-base
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["/usr/local/bin/bootstrap", "-config", "/etc/cyberdns-tip/configs/bootstrap.yaml"]
    environment:
      <<: *service-env
      TIP_ADMIN_EMAIL: ${TIP_ADMIN_EMAIL:-admin@vnnic.vn}
      TIP_ADMIN_PASSWORD: ${TIP_ADMIN_PASSWORD:-}
      TIP_OPENCTI_URL: ${TIP_OPENCTI_URL:-}
      TIP_OPENCTI_TOKEN: ${TIP_OPENCTI_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Chạy một lần rồi thoát. "unless-stopped" ở đây sẽ khiến nó chạy lại vô hạn.
    restart: "no"

  feed-ingestor:
    <<: *service-base
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["/usr/local/bin/feed-ingestor", "-config", "/etc/cyberdns-tip/configs/feed-ingestor.yaml"]
    environment:
      <<: *service-env
      TIP_OPS_ADDR: "0.0.0.0:9101"
    volumes:
      - snapshot-data:/var/lib/cyberdns-tip/snapshots

  policy-engine:
    <<: *service-base
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["/usr/local/bin/policy-engine", "-config", "/etc/cyberdns-tip/configs/policy-engine.yaml"]
    environment:
      <<: *service-env
      TIP_OPS_ADDR: "0.0.0.0:9102"

  blocklist-generator:
    <<: *service-base
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["/usr/local/bin/blocklist-generator", "-config", "/etc/cyberdns-tip/configs/blocklist-generator.yaml"]
    environment:
      <<: *service-env
      TIP_OPS_ADDR: "0.0.0.0:9103"
      # Bind 0.0.0.0 BÊN TRONG container; ánh xạ ra ngoài chỉ tới 127.0.0.1 của
      # host (xem mục ports bên dưới). Bind loopback trong container thì phép ánh
      # xạ cổng của Docker không với tới được.
      TIP_PUBLIC_ADDR: "0.0.0.0:8080"
      TIP_PUBLIC_BASE_URL: "https://tip.cyberdns.vn"
    ports:
      # Chỉ lên loopback của host. nginx trên host proxy tới đây; không ra Internet.
      - "127.0.0.1:8080:8080"
    volumes:
      - snapshot-data:/var/lib/cyberdns-tip/snapshots

  admin-api:
    <<: *service-base
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["/usr/local/bin/admin-api", "-config", "/etc/cyberdns-tip/configs/admin-api.yaml"]
    environment:
      <<: *service-env
      TIP_OPS_ADDR: "0.0.0.0:9104"
      TIP_ADMIN_ADDR: "0.0.0.0:8090"
    ports:
      # Chỉ loopback của host. Dashboard cho phép đổi chính sách chặn nên KHÔNG bao
      # giờ ra Internet: truy cập qua SSH tunnel, hoặc thêm một vhost nginx nội bộ có
      # giới hạn IP.
      - "127.0.0.1:8090:8090"

  # Nghe OpenCTI Live Stream và ghi kết quả xuống L1.
  #
  # Khởi động được cả khi CHƯA bật OpenCTI: thiếu url hoặc token thì service đứng yên
  # và vẫn trả /healthz. OpenCTI là thành phần tùy chọn, nên thoát vì thiếu cấu hình sẽ
  # khiến container quay vòng khởi động lại mãi và làm nhiễu mọi dashboard, trong khi
  # phần còn lại của hệ vẫn chạy hoàn toàn bình thường.
  sync-consumer:
    <<: *service-base
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    command: ["/usr/local/bin/sync-consumer", "-config", "/etc/cyberdns-tip/configs/sync-consumer.yaml"]
    environment:
      <<: *service-env
      TIP_OPS_ADDR: "0.0.0.0:9105"
      # Rỗng khi chưa bật OpenCTI. Lớp phủ docker-compose.opencti.yml điền các giá trị
      # thật khi cụm OpenCTI được khởi động.
      TIP_OPENCTI_URL: ${TIP_OPENCTI_URL:-}
      TIP_OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN:-}
      TIP_OPENCTI_STREAM_ID: ${TIP_OPENCTI_STREAM_ID:-}


  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ../../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?cần đặt GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  snapshot-data:
