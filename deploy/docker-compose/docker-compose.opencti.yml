# OpenCTI — tầng Threat Intelligence của CyberDNS TIP.
#
# Dựa trên compose chính thức tại https://github.com/OpenCTI-Platform/docker, đã cắt
# gọn và siết lại cho đúng vai trò ở đây.
#
# Chạy CHUNG project với stack chính để hai bên nằm cùng một mạng Docker:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.opencti.yml up -d
#
# Chạy lại một mình docker-compose.prod.yml sau đó sẽ báo các container OpenCTI là
# "orphan" — chỉ là cảnh báo, đừng thêm --remove-orphans nếu không muốn xóa chúng.
#
# ---------------------------------------------------------------------------
# BA KHÁC BIỆT SO VỚI COMPOSE CHÍNH THỨC
#
# 1. Bỏ toàn bộ cụm XTM One (xtm-one, xtm-one-worker, pgsql-xtm-one, xtm-composer,
#    rsa-key-generator). Service opencti chỉ phụ thuộc redis, elasticsearch, minio và
#    rabbitmq — XTM One là sản phẩm riêng của Filigran, không cần cho vai trò kho tri
#    thức CTI ở đây, và nó kéo theo một PostgreSQL thứ hai cùng vài GB RAM.
#
# 2. Ghim phiên bản thay vì :latest. Compose chính thức dùng :latest cho tiện thử
#    nghiệm; với production thì một lần docker pull vô tình sẽ nâng cấp cả nền tảng
#    lẫn lược đồ Elasticsearch mà không ai chủ ý (CLAUDE.md quy tắc 10).
#
# 3. KHÔNG publish cổng ra Internet. Giao diện và API của OpenCTI chỉ lắng nghe trên
#    127.0.0.1 của host, đúng yêu cầu "OpenCTI UI/API nằm trong management network"
#    của báo cáo phương án §8.2. Xem deploy/opencti/README.md để biết cách truy cập.
# ---------------------------------------------------------------------------

name: cyberdns-tip

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.16
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      # Tắt security chấp nhận được CHỈ vì Elasticsearch không publish cổng nào và
      # chỉ nằm trong mạng nội bộ của compose. Nếu có ngày nó được phơi ra, phải bật
      # lại xpack.security trước tiên.
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery=ERROR
      - ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE:-4G} -Xmx${ELASTIC_MEMORY_SIZE:-4G}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  redis:
    image: redis:8.8.0
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?cần đặt MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?cần đặt MINIO_ROOT_PASSWORD}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?cần đặt RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?cần đặt RABBITMQ_DEFAULT_PASS}
    volumes:
      - amqpdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  opencti:
    image: opencti/platform:${OPENCTI_VERSION:?cần đặt OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=${OPENCTI_NODE_HEAP:-4096}
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_BASE_URL:-http://localhost:8080}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL:?cần đặt OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:?cần đặt OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:?cần đặt OPENCTI_ADMIN_TOKEN}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY:?cần đặt OPENCTI_ENCRYPTION_KEY}
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY:?cần đặt OPENCTI_HEALTHCHECK_ACCESS_KEY}
      - APP__TELEMETRY__METRICS__ENABLED=true
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
    ports:
      # CHỈ loopback của host. Giao diện quản trị CTI không bao giờ ra Internet;
      # truy cập qua SSH tunnel hoặc vhost nội bộ có giới hạn IP.
      #
      # Cổng host là 8081 chứ không phải 8080: blocklist-generator của stack chính đã
      # chiếm 127.0.0.1:8080. Trùng cổng thì "docker compose up" hỏng ngay với lỗi
      # "port is already allocated".
      - "127.0.0.1:${OPENCTI_HOST_PORT:-8081}:8080"
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis:         { condition: service_healthy }
      minio:         { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }

  opencti-worker:
    image: opencti/worker:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - WORKER_LOG_LEVEL=info
    depends_on:
      - opencti
    deploy:
      mode: replicated
      # Worker là nơi nghẽn khi nhập lượng lớn indicator. Tăng số bản sao khi
      # cyberdns_opencti_stream_lag_seconds bắt đầu leo.
      replicas: ${OPENCTI_WORKER_REPLICAS:-3}

  # --- Connector nội bộ ----------------------------------------------------
  # Đây là các connector nền của OpenCTI, không phải nguồn dữ liệu. Thiếu chúng thì
  # các nút Import/Export trên giao diện sẽ báo lỗi.

  connector-export-file-stix:
    image: opencti/connector-export-file-stix:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID:?cần đặt CONNECTOR_EXPORT_FILE_STIX_ID}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

  connector-export-file-csv:
    image: opencti/connector-export-file-csv:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_CSV_ID:?cần đặt CONNECTOR_EXPORT_FILE_CSV_ID}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

  connector-export-file-txt:
    image: opencti/connector-export-file-txt:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_TXT_ID:?cần đặt CONNECTOR_EXPORT_FILE_TXT_ID}
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileTxt
      - CONNECTOR_SCOPE=text/plain
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

  connector-import-file-stix:
    image: opencti/connector-import-file-stix:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_STIX_ID:?cần đặt CONNECTOR_IMPORT_FILE_STIX_ID}
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_AUTO=true
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

  connector-import-document:
    image: opencti/connector-import-document:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_DOCUMENT_ID:?cần đặt CONNECTOR_IMPORT_DOCUMENT_ID}
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportDocument
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true
      - CONNECTOR_ONLY_CONTEXTUAL=false
      - CONNECTOR_LOG_LEVEL=info
      - IMPORT_DOCUMENT_CREATE_INDICATOR=true
    depends_on:
      - opencti

  # Dữ liệu nền của OpenCTI: marking definition, tổ chức, vị trí địa lý. Không có nó
  # thì phần lớn màn hình trong giao diện trống trơn.
  connector-opencti:
    image: opencti/connector-opencti:${OPENCTI_VERSION}
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID:?cần đặt CONNECTOR_OPENCTI_ID}
      - CONNECTOR_NAME=OpenCTI Datasets
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=100
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

  # MITRE ATT&CK để có ngữ cảnh kỹ thuật tấn công. Lần đồng bộ đầu nặng và kéo dài
  # hàng chục phút, nên để tùy chọn: bật bằng
  #   docker compose --profile mitre -f ... up -d
  connector-mitre:
    image: opencti/connector-mitre:${OPENCTI_VERSION}
    restart: unless-stopped
    profiles: ["mitre"]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID:?cần đặt CONNECTOR_MITRE_ID}
      - CONNECTOR_NAME=MITRE Datasets
      - CONNECTOR_SCOPE=tool,report,malware,identity,campaign,intrusion-set,attack-pattern,course-of-action,x-mitre-data-source,x-mitre-data-component,x-mitre-matrix,x-mitre-tactic,x-mitre-collection
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

volumes:
  esdata:
  redisdata:
  s3data:
  amqpdata:
