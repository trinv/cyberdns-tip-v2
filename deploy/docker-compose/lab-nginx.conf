# nginx cho stack lab.
#
# Khác bản production (deploy/nginx/tip.cyberdns.vn.conf) ở chỗ phân biệt theo CỔNG
# thay vì theo tên miền: lab không có DNS. Chứng thư là bản tự ký do service certgen
# sinh ra, nên trình duyệt sẽ cảnh báo — đó là điều đương nhiên, không phải lỗi.

ssl_certificate     /etc/nginx/certs/lab.crt;
ssl_certificate_key /etc/nginx/certs/lab.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;

# --------------------------------------------------------------- blocklist công khai

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/blocklist.access.log;

    # KHÔNG bật gzip. blocklist-generator đã dựng sẵn bản .gz lúc build snapshot và tự
    # trả về khi client chấp nhận gzip. Bật ở đây là nén lại nội dung đã nén, và module
    # gzip của nginx còn làm yếu ETag (thêm tiền tố W/) nên phá mất cơ chế 304 mà Blocky
    # dựa vào để không tải lại file hàng chục MB mỗi lần làm mới.
    gzip off;

    location / {
        proxy_pass http://blocklist-generator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Tắt đệm: mặc định nginx ghi phản hồi lớn ra file tạm, và all.txt ở quy mô
        # thật là hàng chục tới hàng trăm MB.
        proxy_buffering off;
        proxy_read_timeout 300s;
        send_timeout 30m;
    }
}

# --------------------------------------------------------------- dashboard quản trị

server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/admin.access.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://admin-api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Bắt buộc: admin-api chỉ đặt cờ Secure trên cookie phiên khi biết mình đứng
        # sau HTTPS. Thiếu header này thì đăng nhập được nhưng cookie kém an toàn hơn.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# --------------------------------------------------------------- OpenCTI (tùy chọn)

server {
    listen 10443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/opencti.access.log;

    # DNS nội bộ của Docker, kèm proxy_pass qua BIẾN.
    #
    # Bắt buộc phải viết như vậy: với "proxy_pass http://opencti:8080" viết thẳng, nginx
    # phân giải tên ngay lúc nạp cấu hình và sẽ TỪ CHỐI KHỞI ĐỘNG khi service opencti
    # chưa tồn tại — tức là cả blocklist lẫn dashboard cũng chết theo chỉ vì một service
    # tùy chọn chưa bật. Dùng biến thì việc phân giải lùi tới lúc có request, và khi
    # OpenCTI chưa chạy thì chỉ riêng cổng này trả 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $opencti_upstream http://opencti:8080;

    location / {
        proxy_pass $opencti_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OpenCTI dùng WebSocket cho cập nhật thời gian thực trên giao diện.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
