# nginx cho https://tip.cyberdns.vn
#
# nginx chạy TRÊN HOST bằng systemd, không phải trong container. Lý do: chứng thư số
# nằm ở /etc/letsencrypt trên host, tách hẳn khỏi vòng đời container. Build lại hay
# xóa toàn bộ stack cũng không đụng tới chứng thư, và không có nguy cơ xin lại cert
# rồi chạm trần rate limit của Let's Encrypt (5 lần cấp mỗi tuần cho một tên miền).
#
# Cài đặt:
#   sudo cp deploy/nginx/tip.cyberdns.vn.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/tip.cyberdns.vn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Xem README.md mục "Triển khai production" cho các bước xin chứng thư.

upstream tip_blocklist {
    # blocklist-generator publish cổng ra 127.0.0.1 của host, không ra Internet.
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tip.cyberdns.vn;

    # Giữ đường ACME mở trên cổng 80 để certbot gia hạn được mà KHÔNG cần dừng nginx.
    # Không có khối này thì mỗi lần gia hạn (60 ngày một lần) đều phải stop nginx.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 dùng "listen 443 ssl;" kèm chỉ thị "http2 on;" riêng.
    # Dạng dưới đây chạy được trên mọi phiên bản; từ 1.25.1 nó chỉ cảnh báo deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tip.cyberdns.vn;

    ssl_certificate     /etc/letsencrypt/live/tip.cyberdns.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tip.cyberdns.vn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/tip.cyberdns.vn/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # OCSP stapling cần resolver để tra cứu tên miền của OCSP responder. Thiếu hai
    # dòng này thì stapling im lặng không hoạt động — nginx chỉ ghi một warning vào
    # error log rồi phục vụ bình thường, nên rất dễ tưởng là đã bật.
    # Đổi sang resolver nội bộ của VNNIC nếu có.
    resolver         1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/tip.cyberdns.vn.access.log;
    error_log  /var/log/nginx/tip.cyberdns.vn.error.log;

    # KHÔNG bật gzip ở đây.
    #
    # blocklist-generator đã dựng sẵn bản .gz cạnh mỗi file lúc build snapshot và tự
    # trả về khi client chấp nhận gzip. Bật gzip ở nginx là nén lại một nội dung đã
    # nén cho từng request — với all.txt cỡ vài trăm MB thì đó là khoản CPU lãng phí
    # lớn nhất mà cấu hình này có thể tạo ra. Ngoài ra module gzip của nginx làm yếu
    # ETag (thêm tiền tố W/), phá mất cơ chế 304 mà Blocky dựa vào.
    gzip off;

    location / {
        proxy_pass http://tip_blocklist;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rỗng để dùng keepalive tới upstream.
        proxy_set_header Connection        "";

        # Tắt đệm. Mặc định nginx đệm phản hồi và ghi ra file tạm khi vượt
        # proxy_max_temp_file_size (1 GB); với all.txt cỡ vài trăm MB thì mỗi request
        # sẽ thành một lượt ghi đĩa vô ích. Tắt đệm thì nội dung chảy thẳng ra client.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;

        # Client tải all.txt qua đường truyền chậm có thể cần rất lâu; đừng cắt ngang.
        send_timeout 30m;
    }
}

# Dashboard quản trị lên ở P3. Khi đó thêm server block riêng cho
# admin.tip.cyberdns.vn thay vì gắn vào cùng host: nó cần xác thực và giới hạn IP,
# còn blocklist thì công khai.
